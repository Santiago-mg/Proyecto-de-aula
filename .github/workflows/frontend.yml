name: Pruebas del frontend
on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**']

jobs:
  unitarias:
    name: Unitarias, componentes y regresión (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm run typecheck
      - run: npm run cy:typecheck
      - run: npm test

  e2e:
    name: E2E Screenplay, Katalon, accesibilidad e interfaz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:katalon
      - run: npm run test:accesibilidad
      - run: npm run test:interfaz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-e2e
          path: frontend/docs/evidencias
