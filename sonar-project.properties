sonar.projectKey=CelularPro-Backend

# Para correrlo a mano desde el Mac (npm run sonar). En Jenkins no se usa:
# withSonarQubeEnv('SonarQube') entrega la URL del servidor y tiene prioridad.
sonar.host.url=http://localhost:9000
sonar.projectName=CelularPro API
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Solo se analiza el codigo fuente. Sin esto SonarQube recorre todo el
# proyecto, incluida dist/ (la salida compilada), y reporta como duplicacion
# el codigo generado: por ejemplo dist/infrastructure/database/seed.js, que
# es el mismo seed.ts pero transpilado.
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

sonar.exclusions=dist/**,coverage/**,node_modules/**,prisma/migrations/**,**/*.json

# Mismas exclusiones que coverage.exclude en vitest.config.ts: el arranque,
# la conexión y el seed de la base, y los archivos que solo declaran tipos.
sonar.coverage.exclusions=src/server.ts,src/infrastructure/database/**,src/domain/entities/**,src/domain/repositories/**

# Cobertura generada con: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
