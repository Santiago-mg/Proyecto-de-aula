sonar.projectKey=CelularPro-Backend-Santiago
sonar.host.url=http://localhost:9000
sonar.projectName=CelularPro API - Funcionalidades Santiago (13, 26-30)
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests

# Solo los archivos que tocan las 6 funcionalidades con grafo/diagrama propio:
#   13 - Recomendacion de productos
#   26 - Banear usuario
#   27 - Desbanear usuario
#   28 - Consultar usuarios
#   29 - Panel de estadisticas
#   30 - Administracion de catalogo (CRUD de celulares como admin)
#
# Nota: SonarQube filtra por archivo, no por funcion. phones.use-cases.ts y
# phones.controller.ts/routes.ts mezclan estas funcionalidades con el
# catalogo publico (getPhones, getPhoneById), que no es una de las 6. No hay
# forma de excluir solo esas funciones sin partir el archivo en otro modulo,
# asi que quedan incluidos completos.
sonar.inclusions=\
  src/domain/recomendaciones.ts,\
  src/application/use-cases/phones.use-cases.ts,\
  src/application/use-cases/admin.use-cases.ts,\
  src/application/dtos/admin.dto.ts,\
  src/application/dtos/phone.dto.ts,\
  src/infrastructure/repositories/AdminRepository.ts,\
  src/infrastructure/repositories/PhoneRepository.ts,\
  src/infrastructure/repositories/phone-mapper.ts,\
  src/interface/controllers/admin.controller.ts,\
  src/interface/controllers/phones.controller.ts,\
  src/interface/routes/admin.routes.ts,\
  src/interface/routes/phones.routes.ts,\
  src/interface/middlewares/validate.middleware.ts

sonar.test.inclusions=\
  tests/escenarios/esc-13-recomendacion-productos.test.ts,\
  tests/escenarios/esc-26-banear-usuario.test.ts,\
  tests/escenarios/esc-27-desbanear-usuario.test.ts,\
  tests/escenarios/esc-28-consultar-usuarios.test.ts,\
  tests/escenarios/esc-29-panel-estadisticas.test.ts,\
  tests/escenarios/esc-30-administracion-catalogo.test.ts,\
  tests/unit/catalogo/recomendaciones.test.ts,\
  tests/unit/catalogo/phones.use-cases.test.ts,\
  tests/unit/control-roles/admin.use-cases.test.ts,\
  tests/unit/gestion-perfil/ban.controller.test.ts,\
  tests/unit/gestion-perfil/unban.controller.test.ts

sonar.exclusions=dist/**,coverage/**,node_modules/**,prisma/migrations/**,**/*.json

sonar.javascript.lcov.reportPaths=coverage/lcov.info
